<svg width="320" height="340" viewBox="0 0 320 340" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="fur" x1="160" y1="70" x2="160" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EEF4"/>
    </linearGradient>

    <linearGradient id="belly" x1="160" y1="220" x2="160" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2F6"/>
    </linearGradient>

    <filter id="shadow" x="20" y="30" width="280" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#000B1C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Shadow -->
  <ellipse
    cx="160"
    cy="316"
    rx="94"
    ry="17"
    fill="#000B1C"
    fill-opacity="0.22"
  />

  <g filter="url(#shadow)">

    <!-- Body -->
    <ellipse
      cx="160"
      cy="249"
      rx="82"
      ry="73"
      fill="url(#fur)"
    />

    <!-- Belly -->
    <ellipse
      cx="160"
      cy="260"
      rx="43"
      ry="48"
      fill="url(#belly)"
    />

    <!-- Left arm -->
    <path
      d="M87 227C65 239 63 273 78 290C88 301 102 294 104 280L108 242C108 230 98 222 87 227Z"
      fill="#121927"
    />

    <!-- Right arm -->
    <path
      d="M233 227C255 239 257 273 242 290C232 301 218 294 216 280L212 242C212 230 222 222 233 227Z"
      fill="#121927"
    />

    <!-- Ears -->
    <circle cx="88" cy="84" r="39" fill="#121927"/>
    <circle cx="232" cy="84" r="39" fill="#121927"/>

    <!-- Head -->
    <ellipse
      cx="160"
      cy="145"
      rx="101"
      ry="91"
      fill="url(#fur)"
    />

    <!-- Eye patches -->
    <ellipse
      cx="112"
      cy="143"
      rx="35"
      ry="48"
      transform="rotate(27 112 143)"
      fill="#121927"
    />

    <ellipse
      cx="208"
      cy="143"
      rx="35"
      ry="48"
      transform="rotate(-27 208 143)"
      fill="#121927"
    />

    <!-- Eyes -->
    <ellipse cx="116" cy="145" rx="13" ry="16" fill="white"/>
    <ellipse cx="204" cy="145" rx="13" ry="16" fill="white"/>

    <circle cx="119" cy="147" r="8" fill="#07111F"/>
    <circle cx="201" cy="147" r="8" fill="#07111F"/>

    <!-- Eye highlights -->
    <circle cx="122" cy="143" r="2.5" fill="white"/>
    <circle cx="204" cy="143" r="2.5" fill="white"/>

    <!-- Nose -->
    <ellipse cx="160" cy="177" rx="13" ry="10" fill="#101826"/>

    <!-- Mouth -->
    <path
      d="M160 186C155 194 148 195 143 191"
      stroke="#101826"
      stroke-width="4"
      stroke-linecap="round"
    />

    <path
      d="M160 186C165 194 172 195 177 191"
      stroke="#101826"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Cheeks -->
    <ellipse
      cx="104"
      cy="181"
      rx="14"
      ry="7"
      fill="#FF91AA"
      fill-opacity="0.18"
    />

    <ellipse
      cx="216"
      cy="181"
      rx="14"
      ry="7"
      fill="#FF91AA"
      fill-opacity="0.18"
    />

  </g>

</svg>